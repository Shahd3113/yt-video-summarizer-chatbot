<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Summarizer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 YouTube Video Summarizer</h1>
      <p class="subtitle">الصق رابط أي فيديو يوتيوب وهياخدلك ملخص للمحتوى</p>
    </header>

    <div class="input-card">
      <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
      <select id="langSelect">
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
      <button id="summarizeBtn">لخّص الفيديو</button>
    </div>

    <div id="status" class="status hidden"></div>

    <div id="result" class="result-card hidden">
      <div class="meta">
        <span id="videoIdBadge"></span>
        <span id="lengthBadge"></span>
      </div>
      <h2>الملخص</h2>
      <p id="summaryText"></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
